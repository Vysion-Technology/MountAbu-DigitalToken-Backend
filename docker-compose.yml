services:
  # ===========================================
  # FastAPI Backend
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: etoken-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-172.21.126.76}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - MINIO_HOST=minio
      - MINIO_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - ./backend:/app/backend
      - ./data/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - etoken-network

  # ===========================================
  # MinIO (S3-compatible Object Storage)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: etoken-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - etoken-network

# ===========================================
# Networks
# ===========================================
networks:
  etoken-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  minio_data:
    driver: local
  uploads_data:
    driver: local
